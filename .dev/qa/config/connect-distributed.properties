# Minimal distributed Connect worker config for the local QA harness.
# Run by connect-distributed.sh inside the apache/kafka image.
bootstrap.servers=kafka:9092
group.id=psdb-qa

key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

offset.storage.topic=_psdb_qa_connect_offsets
offset.storage.replication.factor=1
config.storage.topic=_psdb_qa_connect_configs
config.storage.replication.factor=1
status.storage.topic=_psdb_qa_connect_status
status.storage.replication.factor=1
offset.flush.interval.ms=10000

listeners=HTTP://0.0.0.0:8083
rest.advertised.host.name=connect

# Our connector archive is mounted here (as <dir>/lib/*.jar). Kept separate from the
# foreign gRPC at /opt/host-grpc, which is on CLASSPATH (worker/parent loader), NOT here.
plugin.path=/opt/connectors

# hybrid_warn runs the reflective scanner too, which is what surfaces the
# debezium-embedded Transformations$1 NoSuchMethodException (Error 2).
plugin.discovery=hybrid_warn
