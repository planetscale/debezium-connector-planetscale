# Detekt configuration for Planetscale Debezium Connector
# This configuration provides reasonable thresholds for a transform-heavy codebase

complexity:
  # Allow more complex functions for geometry processing
  LongMethod:
    threshold: 80  # increased from default 60
  LongParameterList:
    functionThreshold: 8  # increased from default 6
  TooManyFunctions:
    thresholdInObjects: 25  # increased from default 11 for geometry handlers
    thresholdInClasses: 15  # increased from default 11
  NestedBlockDepth:
    threshold: 6  # increased from default 4 for geometry parsing

exceptions:
  # Allow generic exceptions for transform/parsing code
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

style:
  WildcardImport:
    active: false
  MagicNumber:
    # Allow magic numbers in geometry parsing (WKB format constants)
    active: false
  UseRequire:
    # Allow traditional exception throwing in transform code
    active: false  
  UseCheckOrError:
    # Allow traditional exception throwing in transform code
    active: false
  MaxLineLength:
    maxLineLength: 140  # increased from default 120
  NewLineAtEndOfFile:
    active: true
  UnusedPrivateMember:
    # Allow unused members in transform code (may be used at runtime)
    active: false
  UnusedParameter:
    # Allow unused parameters in transform callbacks
    active: false

performance:
  active: true

potential-bugs:
  active: true

build:
  maxIssues: 200  # Allow more issues initially
  excludeCorrectable: false