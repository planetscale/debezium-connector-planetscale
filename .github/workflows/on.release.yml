name: "Release"

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v3.2.1.Final-r2); created at the dispatched ref if it does not exist"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build"
    uses: ./.github/workflows/job.build.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    permissions:
      contents: read # Needed to checkout and build.
      id-token: write # Needed for build attestations.
      attestations: write # Needed for build attestations.
      checks: write # Needed for test result publishing.
    with:
      release: true
      provenance: true

  release:
    name: "Release"
    needs: [build]
    uses: ./.github/workflows/job.release.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      # Tag push: the pushed tag. Manual dispatch: the tag given as input (never the branch name).
      tag: ${{ inputs.tag || github.ref_name }}
      sha: ${{ github.sha }}
