name: "Release"

# Disabled: requires repository secrets not yet configured for the public repo.
on:
  workflow_dispatch: {}
# push:
#   tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build"
    if: false # disabled: requires repository secrets
    uses: ./.github/workflows/job.build.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    permissions:
      id-token: write
      attestations: write
      checks: write
    with:
      release: true
      provenance: true

  release:
    name: "Release"
    if: false # disabled: requires repository secrets
    needs: [build]
    uses: ./.github/workflows/job.release.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      tag: ${{ github.ref_name }}
      sha: ${{ github.sha }}
