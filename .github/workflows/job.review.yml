name: "AI - Claude Code Review"

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: "ubuntu-latest"
      cache_read_only:
        description: "Cache: Read Only"
        required: false
        type: string
        default: "true"
    secrets:
      ANTHROPIC_API_KEY:
        required: true
        description: "Anthropic API Key"
      GRADLE_ENCRYPTION_KEY:
        required: false
        description: "Gradle Cache Encryption Key"

  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        required: false
        type: string
        default: "ubuntu-latest"
      cache_read_only:
        description: "Cache: Read Only"
        required: false
        type: string
        default: "true"

permissions:
  contents: read

concurrency:
  group: claude-pr-${{ github.sha }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: "Claude"
    runs-on: ${{ inputs.runner || vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    if: |
      !contains(github.event.pull_request.title, '[skip-review]') &&
      !contains(github.event.pull_request.title, '[WIP]') &&
      contains(github.event.pull_request.labels.*.name, 'ai-review')
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: "Setup: Checkout"
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
      - name: "Setup: JVM"
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: ${{ vars.JAVA_TOOLCHAIN_VERSION || '21' }}
          distribution: ${{ vars.JAVA_TOOLCHAIN_VENDOR || 'zulu' }}
      - name: "Setup: Elide"
        uses: elide-dev/setup-elide@d2f742321bf672300c0935839b6f5c6e562a965b # v4.1.0
      - name: "Setup: Gradle"
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v4
        with:
          dependency-graph: ${{ inputs.graph || 'disabled' }}
          dependency-graph-continue-on-failure: 'true'
          cache-overwrite-existing: true
          cache-read-only: ${{ inputs.cache_read_only || 'true' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: "Review: Claude"
        id: claude-review
        uses: anthropics/claude-code-action@6337623ebba10cf8c8214b507993f8062fd4ccfb # beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: |
            Bash(./gradlew build)
            Bash(./gradlew test)
            Bash(./gradlew check)
            Bash(./gradlew clean)

          direct_prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.

            Keep in mind that this is a bytecode-only fork of Debezium Vitess. Consume the `docs/` directory for more
            information about project architecture.
