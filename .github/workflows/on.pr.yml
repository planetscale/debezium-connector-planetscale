name: "PR"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: "Triage"
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    permissions:
      contents: read # Ability to clone the project.
      pull-requests: read # Needed to read PR details and comments.
    outputs:
      changes: ${{ steps.extract_branch.outputs.changes }}
      branch: ${{ steps.extract_branch.outputs.branch }}
      base: ${{ steps.filter.outputs.base }}
      sources: ${{ steps.filter.outputs.sources }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - name: "Setup: Harden Runner"
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: "Setup: Checkout"
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/triage.yml
            .github/labeler.yml
      - name: "Triage: Branch Label"
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      - name: "Triage: PR Labels"
        uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6.0.1
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: "Triage: PR Changes"
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: .github/triage.yml

  build:
    name: "Build"
    needs: [triage]
    uses: ./.github/workflows/job.build.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      CONFLUENT_CLOUD_API_KEY: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
      CONFLUENT_CLOUD_API_SECRET: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}
      CONFLUENT_ENV: ${{ vars.CONFLUENT_ENV }}
      CONFLUENT_CLUSTER: ${{ vars.CONFLUENT_CLUSTER }}
    permissions:
      actions: read # Needed for detection of GitHub Actions environment (SLSA).
      contents: write # Needed for provenance signing and ID (SLSA).
      id-token: write # Needed for release uploads (SLSA).
      checks: write # Needed for test result publishing.
    with:
      build: ${{ needs.triage.outputs.sources == 'true' || needs.triage.outputs.deps == 'true' }}

  # Confluent Cloud smoke test. It is deliberately absent from the release pipeline, and the
  # reusable workflow marks its build/smoke steps continue-on-error so a failure (or absent
  # credentials) can NEVER gate PRs, merges, or releases — only surface as an annotation.
  # (continue-on-error is not permitted on a `uses:` job, so non-blocking lives in the steps.)
  confluent-smoke:
    name: "Confluent Smoke"
    needs: [triage]
    uses: ./.github/workflows/job.confluent-smoke.yml
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      CONFLUENT_CLOUD_API_KEY: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
      CONFLUENT_CLOUD_API_SECRET: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}
      KAFKA_API_KEY: ${{ secrets.KAFKA_API_KEY }}
      KAFKA_API_SECRET: ${{ secrets.KAFKA_API_SECRET }}
      PSDB_PASSWORD: ${{ secrets.PSDB_PASSWORD }}
    permissions:
      contents: read

  review:
    name: "Review"
    uses: ./.github/workflows/job.review.yml
    needs: [triage]
    # don't run for drafts or dependabot
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]' && needs.triage.outputs.sources == 'true'
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    permissions:
      contents: read # Ability to clone the project.
      pull-requests: read # Needed to read PR details and comments.
      issues: read # Needed to read referenced issue details and comments.
      id-token: write # Needed for uploads of artifacts.
