name: "CI"

# Disabled: requires repository secrets not yet configured for the public repo.
on:
  workflow_dispatch: {}
# push:
#   branches:
#     - main
#   paths-ignore:
#     - 'README.md'
#     - '*.md'
#     - '**/*.md'
#     - 'docs/**/*.*'
#     - '.github/*.md'
#     - '.github/workflows/claude.yml'
#     - '.github/workflows/job.review.yml'
#     - '.github/workflows/job.deploy-repo.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build"
    if: false # disabled: requires repository secrets
    uses: ./.github/workflows/job.build.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    permissions:
      contents: read # Needed to checkout and build.
      id-token: write # Needed for build attestations.
      attestations: write # Needed for build attestations.
      checks: write # Needed for test result publishing.
    with:
      provenance: true
